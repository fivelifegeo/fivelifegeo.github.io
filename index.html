<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5LIFE GEO - Official Mining</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:sans-serif;text-align:center;padding:15px;background:#f0e6ff;margin:0}
.card{background:white;padding:20px;border-radius:20px;max-width:420px;margin:auto;box-shadow:0 5px 25px rgba(111,66,193,.2)}
.btn{background:#6f42c1;color:white;border:none;padding:14px 20px;border-radius:12px;font-size:16px;cursor:pointer;margin:6px;width:95%;font-weight:bold}
.btn-green{background:#28a745} .btn-red{background:#dc3545} .btn-orange{background:#ff9800}
.badge{background:#ffc107;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.mining{font-size:32px;font-weight:bold;margin:12px 0}
.timer{background:#e9ecef;padding:10px;border-radius:10px;margin:10px 0;font-family:monospace}
.stats{display:flex;justify-content:space-around;margin:10px 0;font-size:13px}
.leader{ text-align:left; background:#f8f9fa; padding:10px; border-radius:10px; margin-top:10px; font-size:13px}
.footer{margin-top:15px;font-size:12px} .footer a{color:#6f42c1;text-decoration:none;margin:0 5px}
</style>
</head>
<body>
<div class="card" id="app">
<h2 style="margin:5px">5LIFE GEO ⛏️</h2>
<span class="badge">TESTNET v2 - Full Features</span>
<p id="userInfo" style="margin:8px">Welcome Pioneer!</p>

<div id="balanceBox" style="display:none">
<div class="mining">⛏️ <span id="balance">0.00</span> 5LIFE</div>
<div class="stats">
<span>👥 Ref: <b id="refCount">0</b></span>
<span>🌍 GEO: <b id="geoBonus">+0%</b></span>
<span>⚡ Rate: <b id="rate">0.10</b>/s</span>
</div>
<div class="timer" id="timer">⏰ Session: 24:00:00</div>
<div id="geoStatus" style="font-size:12px;color:green"></div>
</div>

<button class="btn" id="connectBtn" onclick="login()">🔗 Connect Pi Wallet</button>
<button class="btn btn-green" id="mineBtn" onclick="toggleMining()" style="display:none">⛏️ Start Mining</button>
<button class="btn btn-orange" id="geoBtn" onclick="checkLocation()" style="display:none">📍 Enable GEO Bonus (+25%)</button>
<button class="btn" onclick="shareApp()" style="background:#25D366">📤 Invite & Earn +10% / referral</button>

<div class="leader" id="leaderboard">
<b>🏆 Community Top Miners (Local)</b><br>
<div id="leaderList">Loading...</div>
</div>

<p id="status" style="font-size:12px;color:#666;margin:10px"></p>
<div class="footer">
<a href="privacy.html">Privacy</a> | <a href="terms.html">TOS</a> | <a href="#" onclick="resetData()">Reset</a>
<br><small id="refInfo"></small>
</div>
</div>

<script>
const Pi = window.Pi;
Pi.init({ version: "2.0", sandbox: true });

let username = null;
let mining = false;
let balance = parseFloat(localStorage.getItem('5life_balance') || '0');
let sessionStart = parseInt(localStorage.getItem('5life_session') || '0');
let refCount = parseInt(localStorage.getItem('5life_ref') || '0');
let geoEnabled = localStorage.getItem('5life_geo') === '1';
let interval = null, timerInterval = null;

// REFERRAL CHECK
const urlParams = new URLSearchParams(window.location.search);
const refBy = urlParams.get('ref');
if(refBy){
  document.getElementById('refInfo').innerText = `Invited by @${refBy} - You get +5% bonus!`;
  localStorage.setItem('5life_invited', refBy);
}

function updateLeaderboard(){
  const board = JSON.parse(localStorage.getItem('5life_board') || '[]');
  if(username){
    const existing = board.find(b=>b.u===username);
    if(existing) existing.b = balance; else board.push({u:username, b:balance});
  }
  board.sort((a,b)=>b.b-a.b);
  const top = board.slice(0,5);
  localStorage.setItem('5life_board', JSON.stringify(board));
  document.getElementById('leaderList').innerHTML = top.map((e,i)=>`${i+1}. @${e.u}: ${e.b.toFixed(2)} 5LIFE`).join('<br>') || 'Be the first miner!';
}
updateLeaderboard();

async function login(){
  try{
    const auth = await Pi.authenticate(['username'], ()=>{});
    username = auth.user.username;
    document.getElementById('userInfo').innerHTML = `Welcome @${username}!`;
    document.getElementById('connectBtn').style.display='none';
    document.getElementById('mineBtn').style.display='block';
    document.getElementById('geoBtn').style.display='block';
    document.getElementById('balanceBox').style.display='block';
    document.getElementById('balance').innerText = balance.toFixed(2);
    document.getElementById('refCount').innerText = refCount;
    document.getElementById('status').innerText = "✅ Wallet Connected - Ready to Mine";
    if(geoEnabled) document.getElementById('geoBonus').innerText = "+25%";
    updateLeaderboard();
    // auto resume if session active
    if(sessionStart && Date.now() - sessionStart < 24*3600*1000){
      toggleMining();
    }
  }catch(e){ alert("Login: "+e.message); }
}

function getRate(){
  let r = 0.10;
  if(localStorage.getItem('5life_invited')) r += 0.005;
  r += refCount * 0.01;
  if(geoEnabled) r *= 1.25;
  return r;
}

function toggleMining(){
  if(!mining){
    if(!sessionStart || Date.now() - sessionStart > 24*3600*1000){
      sessionStart = Date.now();
      localStorage.setItem('5life_session', sessionStart);
    }
    mining = true;
    document.getElementById('mineBtn').innerText = "⏸️ Stop Mining";
    document.getElementById('mineBtn').className = "btn btn-red";
    document.getElementById('rate').innerText = getRate().toFixed(2);
    
    interval = setInterval(()=>{
      balance += getRate();
      document.getElementById('balance').innerText = balance.toFixed(2);
      localStorage.setItem('5life_balance', balance);
      updateLeaderboard();
    }, 1000);
    
    timerInterval = setInterval(()=>{
      const elapsed = Date.now() - sessionStart;
      const remain = 24*3600*1000 - elapsed;
      if(remain <=0){
        toggleMining();
        document.getElementById('status').innerText = "✅ 24h Session Finished! Start new session.";
        localStorage.setItem('5life_session','0');
        return;
      }
      const h = Math.floor(remain/3600000);
      const m = Math.floor((remain%3600000)/60000);
      const s = Math.floor((remain%60000)/1000);
      document.getElementById('timer').innerText = `⏰ Session: ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')} left`;
    }, 1000);
    
  } else {
    mining = false;
    clearInterval(interval); clearInterval(timerInterval);
    document.getElementById('mineBtn').innerText = "⛏️ Start Mining";
    document.getElementById('mineBtn').className = "btn btn-green";
  }
}

function checkLocation(){
  if(!navigator.geolocation){ alert("No GPS"); return; }
  document.getElementById('geoStatus').innerText = "📡 Checking location...";
  navigator.geolocation.getCurrentPosition(pos=>{
    geoEnabled = true;
    localStorage.setItem('5life_geo','1');
    document.getElementById('geoBonus').innerText = "+25%";
    document.getElementById('rate').innerText = getRate().toFixed(2);
    document.getElementById('geoStatus').innerText = `✅ GEO Verified! Lat ${pos.coords.latitude.toFixed(3)} - Bonus Active!`;
    document.getElementById('geoBtn').style.display='none';
  }, ()=>{ document.getElementById('geoStatus').innerText="❌ Enable GPS for bonus"; });
}

function shareApp(){
  const refLink = `https://fivelifegeo.github.io?ref=${username || 'geovaniepascual'}`;
  if(navigator.share){
    navigator.share({title:'5LIFE GEO Mining', text:`Mine 5LIFE with me! Use my referral: ${refLink}`, url:refLink});
  } else {
    navigator.clipboard.writeText(refLink);
    alert("Referral link copied: "+refLink+"\nShare to get +10% bonus per friend!");
    refCount++; localStorage.setItem('5life_ref', refCount);
    document.getElementById('refCount').innerText = refCount;
  }
}
function resetData(){ if(confirm("Reset all test data?")){ localStorage.clear(); location.reload(); } }
</script>
</body>
  </html>
