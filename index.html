<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>5LIFE GEO - TESTNET</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff8e1;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#6f42c1;color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.badge-test{background:#ffc107;color:#000;font-size:10px;padding:3px 10px;border-radius:10px;font-weight:800}
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:90px}
.balance-card{background:linear-gradient(135deg,#6f42c1,#ff9800);color:white;border-radius:20px;padding:20px;text-align:center}
.mine-circle{width:180px;height:180px;border-radius:50%;margin:25px auto;background:conic-gradient(from 0deg,#6f42c1,#ff9800,#6f42c1);display:flex;align-items:center;justify-content:center;animation:spin 3s linear infinite paused}
.mine-circle.active{animation-play-state:running}
.mine-circle .inner{width:160px;height:160px;background:white;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
@keyframes spin{to{transform:rotate(360deg)}}
.timer-card{background:white;border-radius:14px;padding:12px;margin:14px 0;display:flex;justify-content:space-between;align-items:center}
.btn-main{width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;margin:6px 0}
.btn-mine{background:#28a745;color:white}.btn-stop{background:#dc3545;color:white}.btn-geo{background:#ff9800;color:white}.btn-pay{background:#6f42c1;color:white}
.stat-box{background:white;border-radius:12px;padding:12px;text-align:center}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:8px 0 14px;border-top:1px solid #eee}
.nav-item{text-align:center;font-size:11px;color:#999;flex:1}.nav-item.active{color:#6f42c1;font-weight:700}.nav-item .icon{font-size:22px;display:block}
.pay-card{background:white;border-radius:14px;padding:14px;margin:10px 0}
.input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-top:8px}
.badge{background:#fff3cd;padding:8px;border-radius:8px;margin-top:8px;font-size:12px;word-break:break-all;border:1px solid #ffc107}
</style>
</head><body>
<div class="header"><h1>⛏️ 5LIFE GEO</h1><div><span class="badge-test">TESTNET v3</span> <span id="userBadge" style="font-size:12px"></span></div></div>
<div class="content">
<div class="balance-card"><div style="font-size:12px;opacity:.9">TOTAL 5LIFE - TESTNET</div><div style="font-size:38px;font-weight:900">⛏️ <span id="balance">0.00</span></div><div style="font-size:12px;display:flex;gap:12px;justify-content:center;margin-top:8px"><span>⚡ <b id="rate">0.10</b>/s</span><span>👥 <b id="refCount">0</b></span><span>🌍 <b id="geoBonus">+0%</b></span></div></div>
<div class="mine-circle" id="mineCircle"><div class="inner"><div style="font-size:40px">⛏️</div><div id="mineStatus" style="font-size:12px;font-weight:700">NOT MINING</div><div id="balanceMini" style="font-size:14px;color:#6f42c1;font-weight:800">0.00</div></div></div>
<div class="timer-card"><div><b>⏰ Session</b><br><small>24h</small></div><div id="timer" style="font-family:monospace;font-weight:800">24:00:00</div></div>
<button class="btn-main" id="connectBtn" onclick="login()" style="background:#6f42c1;color:white">🔗 Connect Pi Testnet</button>
<button class="btn-main btn-mine" id="mineBtn" onclick="toggleMining()" style="display:none">▶️ Start Mining</button>
<button class="btn-main btn-geo" id="geoBtn" onclick="checkLocation()" style="display:none">📍 GEO +25%</button>
<button class="btn-main btn-pay" onclick="location.href='pay.html'">👛 Open PAY Testnet - Zero Fee</button>
<button class="btn-main" style="background:#25D366;color:white" onclick="shareApp()">📤 Invite +10%</button>
<div class="stats-grid"><div class="stat-box"><small>Ref Bonus</small><br><b id="statRef">0</b></div><div class="stat-box"><small>PAY Wallet</small><br><b id="payBal">0</b></div></div>
<div class="pay-card">
<b>Claim & Send - TESTNET Zero Fee</b>
<div class="badge">Testnet PAY = @username - zero fee</div>
<button class="btn-main" style="background:#ffc107;color:#000" onclick="claimToPay()">⬇️ Claim Mining -> PAY (zero fee)</button>
<hr style="margin:10px 0">
<input id="sendTo" class="input" placeholder="@username">
<input id="amount" class="input" type="number" placeholder="Amount">
<button class="btn-main" onclick="startScan()">📷 Scan QR</button>
<div id="qr-reader"></div>
<button class="btn-main" style="background:#00a86b;color:white" onclick="sendPay()">Send Zero Fee (Testnet)</button>
</div>
<div class="pay-card"><b>🏆 Miners</b><div id="leaderList" style="margin-top:8px;font-size:13px"></div></div>
<p id="status" style="text-align:center;font-size:12px;color:#666"></p>
</div>
<div class="bottom-nav"><div class="nav-item active"><span class="icon">⛏️</span>Mine</div><div class="nav-item" onclick="shareApp()"><span class="icon">👥</span>Team</div><div class="nav-item" onclick="checkLocation()"><span class="icon">🌍</span>GEO</div><div class="nav-item" onclick="location.href='pay.html'"><span class="icon">👛</span>Wallet</div></div>
<script>
const ISSUER="GD3OIJAV677OHQDZ25QXVDMWAD3AKJ6CGBMXKXZLGTBVUFC4TN2EX2BS";
Pi.init({version:"2.0",sandbox:true});
let username=localStorage.getItem('5life_user')||null;
let balance=parseFloat(localStorage.getItem('5life_balance')||'0');
let sessionStart=parseInt(localStorage.getItem('5life_session')||'0');
let lastUpdate=parseInt(localStorage.getItem('5life_last')||'0');
let refCount=parseInt(localStorage.getItem('5life_ref')||'0');
let geoEnabled=localStorage.getItem('5life_geo')==='1';
let mining=false, interval=null, timerInterval=null, html5QrCode=null;

function getPayKey(){return 'pay_test_' + (username||'guest');}
function getPayBal(){return parseFloat(localStorage.getItem(getPayKey())||'0');}
function setPayBal(v){localStorage.setItem(getPayKey(),v); localStorage.setItem('pay_test',v);}

function getRate(){let r=0.10; if(localStorage.getItem('5life_invited')) r+=0.005; r+=refCount*0.01; if(geoEnabled) r*=1.25; return r;}
function updateUI(){
 document.getElementById('balance').innerText=balance.toFixed(2);
 document.getElementById('balanceMini').innerText=balance.toFixed(2);
 document.getElementById('refCount').innerText=refCount;
 document.getElementById('statRef').innerText=refCount;
 document.getElementById('geoBonus').innerText=geoEnabled?'+25%':'+0%';
 document.getElementById('rate').innerText=getRate().toFixed(2);
 document.getElementById('payBal').innerText=getPayBal().toFixed(2);
 localStorage.setItem('5life_balance',balance);
}
function updateLeaderboard(){const b=JSON.parse(localStorage.getItem('5life_board')||'[]'); if(username){const ex=b.find(x=>x.u===username); if(ex) ex.b=balance; else b.push({u:username,b:balance});} b.sort((a,b)=>b.b-a.b); localStorage.setItem('5life_board',JSON.stringify(b)); document.getElementById('leaderList').innerHTML=b.slice(0,5).map((e,i)=>`${i+1}. <b>@${e.u}</b>: ${e.b.toFixed(2)}`).join('<br>')||'Be first!';}
function restore(){if(username){document.getElementById('userBadge').innerText='@'+username; document.getElementById('connectBtn').style.display='none'; document.getElementById('mineBtn').style.display='block'; document.getElementById('geoBtn').style.display='block';} if(sessionStart && Date.now()-sessionStart<86400000){let el=Math.floor((Date.now()-lastUpdate)/1000); if(el>0) balance+=el*getRate(); setTimeout(()=>{if(!mining) toggleMining();},800);} updateUI(); updateLeaderboard();}
restore();
async function login(){try{const auth=await Pi.authenticate(['username'],()=>{}); username=auth.user.username; localStorage.setItem('5life_user',username); document.getElementById('userBadge').innerText='@'+username; document.getElementById('connectBtn').style.display='none'; document.getElementById('mineBtn').style.display='block'; document.getElementById('geoBtn').style.display='block'; updateUI(); updateLeaderboard();}catch(e){alert(e.message);}}
function toggleMining(){if(!mining){if(!sessionStart || Date.now()-sessionStart>86400000){sessionStart=Date.now(); localStorage.setItem('5life_session',sessionStart);} mining=true; lastUpdate=Date.now(); document.getElementById('mineBtn').innerText='⏸️ Stop'; document.getElementById('mineBtn').className='btn-main btn-stop'; document.getElementById('mineCircle').classList.add('active'); document.getElementById('mineStatus').innerText='MINING...'; interval=setInterval(()=>{balance+=getRate(); localStorage.setItem('5life_last',Date.now()); updateUI(); updateLeaderboard();},1000); timerInterval=setInterval(()=>{const rem=86400000-(Date.now()-sessionStart); if(rem<=0){toggleMining(); document.getElementById('timer').innerText='00:00:00'; return;} const h=Math.floor(rem/3600000),m=Math.floor((rem%3600000)/60000),s=Math.floor((rem%60000)/1000); document.getElementById('timer').innerText=`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;},1000);}else{mining=false; clearInterval(interval); clearInterval(timerInterval); localStorage.setItem('5life_last',Date.now()); document.getElementById('mineBtn').innerText='▶️ Start Mining'; document.getElementById('mineBtn').className='btn-main btn-mine'; document.getElementById('mineCircle').classList.remove('active'); document.getElementById('mineStatus').innerText='PAUSED';}}
function checkLocation(){if(!navigator.geolocation){alert('No GPS'); return;} navigator.geolocation.getCurrentPosition(()=>{geoEnabled=true; localStorage.setItem('5life_geo','1'); updateUI();},()=>{alert('Enable GPS');});}
function shareApp(){const link=`https://fivelifegeo.github.io?ref=${username||'geovaniepascual'}`; navigator.clipboard.writeText(link); alert('Copied: '+link); refCount++; localStorage.setItem('5life_ref',refCount); updateUI();}
function claimToPay(){if(balance<1) return alert("Need 1 5LIFE"); let pb=getPayBal()+balance; setPayBal(pb); alert(`✅ Claimed ${balance.toFixed(2)} to @${username} PAY TESTNET - Zero Fee!`); balance=0; updateUI(); location.href='pay.html';}
function startScan(){const div=document.getElementById('qr-reader'); if(html5QrCode && html5QrCode.isScanning){html5QrCode.stop(); div.innerHTML=''; return;} html5QrCode=new Html5Qrcode("qr-reader"); html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:250},(txt)=>{let v=txt; if(v.includes('5LIFE-PAY:')) v=v.split('5LIFE-PAY:')[1]; v=v.replace('@','').trim(); document.getElementById('sendTo').value=v; html5QrCode.stop(); div.innerHTML='';},()=>{});}
function sendPay(){let to=document.getElementById('sendTo').value.trim().replace('@','').replace('5LIFE-PAY:',''); let amt=parseFloat(document.getElementById('amount').value); if(!to||!amt) return alert("Lagyan @ at amount"); let pb=getPayBal(); if(amt>pb) return alert("Kulang"); setPayBal(pb-amt); let toKey='pay_test_'+to; let toBal=parseFloat(localStorage.getItem(toKey)||'0')+amt; localStorage.setItem(toKey,toBal); updateUI(); alert(`✅ Sent ${amt} to @${to} - ZERO FEE TESTNET!`);}
</script></body></html>
