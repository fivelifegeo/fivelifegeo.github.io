
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5LIFE GEO - Testnet Mining</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:sans-serif;text-align:center;padding:20px;background:#f3e8ff}
.card{background:white;padding:20px;border-radius:15px;max-width:380px;margin:auto;box-shadow:0 4px 15px rgba(0,0,0,.15)}
.btn{background:#6f42c1;color:white;border:none;padding:12px 20px;border-radius:10px;font-size:16px;cursor:pointer;margin:5px;width:90%}
.btn:disabled{background:gray}
.badge{background:#ffc107;padding:5px 10px;border-radius:20px;font-size:12px}
.mining{font-size:28px;margin:10px 0}
.footer{margin-top:15px;font-size:13px}
.footer a{color:#6f42c1;text-decoration:none}
</style>
</head>
<body>
<div class="card" id="app">
<h2>5LIFE GEO ⛏️</h2>
<span class="badge">TESTNET - Community Test</span>
<p id="userInfo">Welcome Pioneer!</p>
<div id="balanceBox" style="display:none">
<div class="mining">⛏️ <span id="balance">0.00</span> 5LIFE</div>
<p style="font-size:13px" id="rate">Rate: 0.10 / sec</p>
</div>
<button class="btn" id="connectBtn" onclick="login()">Connect Pi Wallet (Testnet)</button>
<button class="btn" id="mineBtn" onclick="toggleMining()" style="display:none;background:#28a745">Start Mining</button>
<p id="status" style="font-size:13px;color:#666"></p>
<div class="footer"><a href="privacy.html">Privacy</a> | <a href="terms.html">TOS</a></div>
</div>

<script>
const Pi = window.Pi;
// TESTNET CONFIG - ayan yung Testnet mo boss
Pi.init({ version: "2.0", sandbox: true });

let username = null;
let mining = false;
let balance = parseFloat(localStorage.getItem('5life_balance') || '0');
let interval = null;

async function login(){
  try{
    const auth = await Pi.authenticate(['username'], onIncompletePaymentFound);
    username = auth.user.username;
    document.getElementById('userInfo').innerHTML = `Welcome @${username}!`;
    document.getElementById('connectBtn').style.display='none';
    document.getElementById('mineBtn').style.display='block';
    document.getElementById('balanceBox').style.display='block';
    document.getElementById('balance').innerText = balance.toFixed(2);
    document.getElementById('status').innerText = "✅ Wallet Connected - Testnet Ready";
  }catch(e){ alert("Login failed: "+e.message); }
}
function onIncompletePaymentFound(p){}

function toggleMining(){
  if(!mining){
    mining = true;
    document.getElementById('mineBtn').innerText = "Stop Mining";
    document.getElementById('mineBtn').style.background = "#dc3545";
    document.getElementById('status').innerText = "⛏️ Mining... Community Test Active";
    interval = setInterval(()=>{
      balance += 0.10;
      document.getElementById('balance').innerText = balance.toFixed(2);
      localStorage.setItem('5life_balance', balance);
    }, 1000);
  } else {
    mining = false;
    clearInterval(interval);
    document.getElementById('mineBtn').innerText = "Start Mining";
    document.getElementById('mineBtn').style.background = "#28a745";
    document.getElementById('status').innerText = "⏸️ Paused - "+balance.toFixed(2)+" 5LIFE saved";
  }
}
</script>
</body>
</html>
