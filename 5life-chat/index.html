<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5LIFE Chat</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/12.1.0/stellar-sdk.min.js"></script>
<style>
body{font-family:sans-serif;background:#0f0f0f;color:white;max-width:480px;margin:auto;padding:15px}
.card{background:#1e1e1e;padding:15px;border-radius:15px;margin-top:15px}
button{width:100%;padding:12px;border-radius:10px;border:none;background:#6f42c1;color:white;font-weight:bold;margin-top:10px}
.chat{height:300px;overflow-y:auto;background:#111;padding:10px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<h2>💜 5LIFE Chat</h2>
<div class="card">
<p id="user">Not logged in</p>
<p>Balance: <span id="bal">0</span> 5LIFE</p>
<p>Daily Streak: <span id="streak">0</span> days</p>
<button onclick="loginPi()">Login with Pi</button>
<button onclick="claimDaily()" style="background:#00c853">Claim Daily 10 5LIFE</button>
</div>

<div class="card">
<div id="chatBox" class="chat"><small>Welcome to 5LIFE Chat...</small></div>
<input id="msg" placeholder="Type message..." style="width:70%;padding:10px;border-radius:8px">
<button onclick="sendMsg()" style="width:25%;display:inline">Send</button>
</div>

<script>
// CONFIG - ITO LANG PALITAN MO
const ISSUER = 'GD3OIJAV677OHQDZ25QXVDMWAD3AKJ6CGBMXKXZLGTBVUFC4TN2EX2BS';
const DAILY_AMOUNT = 10;

const Pi = window.Pi;
Pi.init({version:"2.0", sandbox:true});

let userWallet = null;

async function loginPi(){
  try{
    const auth = await Pi.authenticate(['username','payments'], onIncompletePayment);
    userWallet = auth.user.uid;
    document.getElementById('user').innerText = "Hi, @"+auth.user.username;
    loadStreak();
  }catch(e){alert("Login failed: "+e.message)}
}

function onIncompletePayment(payment){console.log(payment)}

function loadStreak(){
  let streak = localStorage.getItem('5life_streak') || 0;
  document.getElementById('streak').innerText = streak;
  let bal = localStorage.getItem('5life_balance') || 0;
  document.getElementById('bal').innerText = bal;
}

function claimDaily(){
  if(!userWallet){alert("Login muna boss!");return;}
  let last = localStorage.getItem('5life_lastClaim');
  let today = new Date().toDateString();
  if(last === today){alert("Nakuha mo na today boss! Bukas ulit.");return;}

  // FOR NOW - LOCAL MUNA, PAG MAY BACKEND KA NA PALITAN NG FETCH
  let bal = parseInt(localStorage.getItem('5life_balance')||0);
  bal += DAILY_AMOUNT;
  localStorage.setItem('5life_balance', bal);
  localStorage.setItem('5life_lastClaim', today);
  
  let streak = parseInt(localStorage.getItem('5life_streak')||0)+1;
  localStorage.setItem('5life_streak', streak);
  
  loadStreak();
  addChat("System: +"+DAILY_AMOUNT+" 5LIFE claimed! Total: "+bal);
  
  // TODO: Pag may backend ka na, ipadala sa real wallet
  // fetch('your-backend/claim', {method:'POST', body:JSON.stringify({wallet:userWallet, amount:DAILY_AMOUNT})})
}

function sendMsg(){
  let m = document.getElementById('msg').value;
  if(!m)return;
  addChat("You: "+m);
  document.getElementById('msg').value='';
}
function addChat(t){
  let b = document.getElementById('chatBox');
  b.innerHTML += "<div style='margin:5px 0'>"+t+"</div>";
  b.scrollTop = b.scrollHeight;
}
</script>
</body>
</html>
