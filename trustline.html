<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>5LIFE Trustline</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/12.1.0/stellar-sdk.min.js"></script>
</head>
<body style="font-family:sans-serif;padding:20px;max-width:500px;margin:auto;text-align:center">
<h2>🔗 Add 5LIFE Trustline</h2>
<p>Issuer: GD3OIJAV677OHQDZ25QXVDMWAD3AKJ6CGBMXKXZLGTBVUFC4TN2EX2BS</p>
<p>Asset: 5LIFE</p>
<input id="sec" placeholder="Secret mo (S... ng receiver)" style="width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px">
<button onclick="addTL()" style="width:100%;padding:14px;background:#00c853;color:white;border:none;border-radius:10px;font-weight:bold">ADD TRUSTLINE NOW</button>
<div id="log" style="margin-top:15px;background:#f5f5f5;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap;text-align:left"></div>

<script>
const server=new StellarSdk.Horizon.Server('https://api.testnet.minepi.com');
const issuer='GD3OIJAV677OHQDZ25QXVDMWAD3AKJ6CGBMXKXZLGTBVUFC4TN2EX2BS';
async function addTL(){
 let log=document.getElementById('log');
 let sec=document.getElementById('sec').value.trim();
 if(!sec.startsWith('S')){log.innerText='Lagay secret na S...';return;}
 log.innerText='Adding trustline...\n';
 try{
  const kp=StellarSdk.Keypair.fromSecret(sec);
  const pub=kp.publicKey();
  log.innerText+='Wallet: '+pub+'\n';
  const acc=await server.loadAccount(pub);
  const asset=new StellarSdk.Asset('5LIFE',issuer);
  const tx=new StellarSdk.TransactionBuilder(acc,{fee:"1000000",networkPassphrase:'Pi Testnet'})
  .addOperation(StellarSdk.Operation.changeTrust({asset:asset}))
  .setTimeout(60).build();
  tx.sign(kp);
  const res=await server.submitTransaction(tx);
  log.innerText+='\n✅ SUCCESS! Trustline added!\nPwede ka na tumanggap ng 5LIFE!\nHash: '+res.hash;
 }catch(e){log.innerText+='\n❌ Error: '+(e.response?JSON.stringify(e.response.data,null,2):e.message);}
}
</script>
</body></html>
