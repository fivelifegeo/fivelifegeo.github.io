<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Mint 5LIFE</title><script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/12.1.0/stellar-sdk.min.js"></script></head><body style="font-family:sans-serif;padding:20px;max-width:500px;margin:auto"><h2>Mint 5LIFE - CHECK KEY</h2><input id="sec" placeholder="SB3... Secret Key" style="width:100%;padding:10px"><button onclick="check()" style="width:100%;padding:12px;background:black;color:white;border:none;border-radius:10px;margin-top:10px">CHECK SECRET KEY KO</button><div id="log" style="margin-top:15px;background:#f5f5f5;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap"></div><script>async function check(){let sec=document.getElementById('sec').value.trim();let log=document.getElementById('log');try{let kp=StellarSdk.Keypair.fromSecret(sec);log.innerText='Secret OK!\nPublic mo: '+kp.publicKey()+'\n\nNgayon punta ka faucet:\nhttps://faucet.testnet.minepi.com\nI-paste yang Public mo.'}catch(e){log.innerText='Mali Secret Key! '+e.message}}</script></body></html>
