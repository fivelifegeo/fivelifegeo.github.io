<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mint 5LIFE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/12.1.0/stellar-sdk.min.js"></script>
</head>
<body style="font-family:sans-serif;padding:20px;max-width:500px;margin:auto">
<h2>Mint 5LIFE - Pi Testnet</h2>
<p>Issuer: GD3OIJAV6770HQDZ25QXVDMWAD3AKJ6CGBMXKXZLGTBVUFC4TN2EX2B5</p>
<button onclick="mint()" style="padding:12px;width:100%;background:#6f42c1;color:white;border:none;border-radius:10px;font-size:16px">MINT 5LIFE</button>
<div id="log" style="margin-top:15px;background:#f5f5f5;padding:10px;border-radius:10px;white-space:pre-wrap;font-size:12px"></div>
<script>
const server = new StellarSdk.Horizon.Server('https://api.testnet.minepi.com');
const issuer = 'GD3OIJAV6770HQDZ25QXVDMWAD3AKJ6CGBMXKXZLGTBVUFC4TN2EX2B5';
async function mint(){
 let log=document.getElementById('log');
 log.innerText='Checking issuer...';
 try{
  const acc=await server.loadAccount(issuer);
  log.innerText+='\n✅ Issuer OK: '+issuer+'\nBalances:\n'+JSON.stringify(acc.balances,null,2);
  log.innerText+='\n\nREADY TO MINT - Fund first if not found';
 }catch(e){
  log.innerText+='\n❌ Issuer NOT FOUND\nPunta ka sa: https://faucet.testnet.minepi.com\nI-paste address na to:\n'+issuer;
 }
}
</script>
</body>
</html>
